<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SketchCab — перевірка</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:20px 16px 60px; background:#0f1216; color:#e9edf1;
         font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:20px; }
  .sub { color:#7e8b99; font-size:13px; margin-bottom:20px; }
  .verdict { padding:14px 16px; border-radius:12px; margin-bottom:20px;
             border:1px solid #2b333d; background:#161b21; font-size:14px; }
  .verdict.ok  { border-color:#4dffa1; }
  .verdict.bad { border-color:#ff5c5c; }
  .verdict b { display:block; margin-bottom:6px; font-size:15px; }
  h2 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#7e8b99;
       margin:22px 0 8px; font-weight:600; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; gap:10px; align-items:flex-start; padding:9px 12px;
       border:1px solid #2b333d; border-radius:8px; margin-bottom:6px; background:#161b21; }
  li .icon { flex:0 0 auto; width:18px; font:700 14px/1.3 ui-monospace,monospace; }
  li.ok   .icon { color:#4dffa1; }
  li.bad  .icon { color:#ff5c5c; }
  li.warn .icon { color:#f2b33d; }
  li .body { min-width:0; flex:1; }
  li .name { font:12px/1.4 ui-monospace,Consolas,monospace; word-break:break-all; }
  li .note { color:#7e8b99; font-size:12px; margin-top:3px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
  button, a.btn { background:#1e242c; color:#e9edf1; border:1px solid #2b333d;
    border-radius:9px; padding:12px 16px; font-size:13px; cursor:pointer;
    text-decoration:none; display:inline-block; }
  button.primary { background:#f2b33d; color:#191203; border-color:#f2b33d; font-weight:600; }
  button:hover, a.btn:hover { border-color:#f2b33d; }
  pre { background:#11141a; border:1px solid #2b333d; border-radius:8px; padding:12px;
        overflow-x:auto; font-size:12px; color:#8b95a3; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Перевірка в'ювера</h1>
  <div class="sub">Сторінка сама перевіряє все, що потрібно для роботи 3D, і каже, що зламано.</div>

  <div class="verdict" id="verdict"><b>Перевіряю…</b><span>кілька секунд</span></div>

  <h2>Сервер і файли застосунку</h2>
  <ul id="core"></ul>

  <h2>Бібліотеки (крок «завантажити бібліотеки»)</h2>
  <ul id="vendor"></ul>

  <h2>Дані проєктів</h2>
  <ul id="data"></ul>

  <h2>Браузер</h2>
  <ul id="env"></ul>

  <div class="actions">
    <button class="primary" onclick="location.reload()">Перевірити ще раз</button>
    <button onclick="resetAll()">Скинути кеш і Service Worker</button>
    <a class="btn" href="index.html">Відкрити в'ювер</a>
  </div>

  <h2>Для звіту</h2>
  <pre id="report">—</pre>
</div>

<script>
(function () {
  'use strict';

  var lines = [];

  function add(listId, status, name, note) {
    var ul = document.getElementById(listId);
    var li = document.createElement('li');
    li.className = status;
    var icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = status === 'ok' ? '✓' : status === 'warn' ? '!' : '✗';
    var body = document.createElement('div');
    body.className = 'body';
    var nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = name;
    body.appendChild(nameEl);
    if (note) {
      var noteEl = document.createElement('div');
      noteEl.className = 'note';
      noteEl.textContent = note;
      body.appendChild(noteEl);
    }
    li.appendChild(icon);
    li.appendChild(body);
    ul.appendChild(li);
    lines.push((status === 'ok' ? '[ok]  ' : status === 'warn' ? '[!]   ' : '[FAIL]') +
               ' ' + name + (note ? ' — ' + note : ''));
  }

  async function probe(url) {
    try {
      var response = await fetch(url + '?probe=' + Date.now(), { cache: 'no-store' });
      return { ok: response.ok, status: response.status, response: response };
    } catch (error) {
      return { ok: false, status: 0, error: error };
    }
  }

  var failures = { server: false, vendor: 0, data: 0, core: 0 };

  async function checkFile(listId, url, kind, hint) {
    var result = await probe(url);
    if (result.ok) {
      add(listId, 'ok', url);
      return result.response;
    }
    if (result.status === 0) failures.server = true;
    failures[kind] += 1;
    add(listId, 'bad', url,
        result.status === 0 ? 'сервер не відповідає' : 'HTTP ' + result.status + (hint ? ' · ' + hint : ''));
    return null;
  }

  async function run() {
    // --- ядро застосунку ---
    var css = await checkFile('core', 'styles.css', 'core');
    if (css) {
      var text = await css.text();
      var fixed = text.indexOf('[hidden]') !== -1;
      add('core', fixed ? 'ok' : 'warn', 'styles.css: версія з виправленням [hidden]',
          fixed ? null : 'стара копія — замініть файл і скиньте кеш кнопкою нижче');
    }
    await checkFile('core', 'app.js', 'core');
    await checkFile('core', 'index.html', 'core');
    var sw = await checkFile('core', 'sw.js', 'core');
    if (sw) {
      var swText = await sw.text();
      var version = (swText.match(/VERSION\s*=\s*'([^']+)'/) || [])[1] || '?';
      add('core', 'ok', 'версія оболонки: ' + version);
    }

    // --- бібліотеки ---
    await checkFile('vendor', 'vendor/three/three.module.js', 'vendor', 'запустіть 1-завантажити-бібліотеки.bat');
    await checkFile('vendor', 'vendor/three/addons/loaders/GLTFLoader.js', 'vendor');
    await checkFile('vendor', 'vendor/three/addons/controls/OrbitControls.js', 'vendor');
    await checkFile('vendor', 'vendor/three/addons/utils/BufferGeometryUtils.js', 'vendor');
    await checkFile('vendor', 'vendor/html5-qrcode/html5-qrcode.min.js', 'vendor');

    // чи справді three.js імпортується
    try {
      await import('./vendor/three/three.module.js');
      add('vendor', 'ok', 'three.js імпортується як ES-модуль');
    } catch (error) {
      failures.vendor += 1;
      add('vendor', 'bad', 'three.js не імпортується', String(error.message || error).slice(0, 120));
    }

    // --- дані ---
    var index = await checkFile('data', 'projects/index.json', 'data');
    var projects = [];
    if (index) {
      try {
        projects = await index.json();
        add('data', projects.length ? 'ok' : 'warn',
            'проєктів у реєстрі: ' + projects.length,
            projects.length ? projects.map(function (p) { return p.id; }).join(', ') : 'зробіть експорт зі SketchUp');
      } catch (error) {
        add('data', 'bad', 'projects/index.json пошкоджено', String(error.message).slice(0, 100));
      }
    }
    if (projects.length) {
      var id = projects[0].id;
      var manifest = await checkFile('data', 'projects/' + id + '/manifest.json', 'data');
      if (manifest) {
        try {
          var data = await manifest.json();
          add('data', 'ok', 'деталей у проєкті: ' + (data.parts || []).length);
          // з версії 4.0 усі деталі лежать в одному parts.glb;
          // assembly.glb лишився тільки в старих проєктах
          var model = data.partsGlb || data.assemblyGlb;
          if (model) {
            await checkFile('data', 'projects/' + id + '/' + model, 'data');
          } else {
            add('data', 'warn', 'у маніфесті немає моделі', 'зроби експорт наново');
          }
        } catch (error) {
          add('data', 'bad', 'manifest.json не читається', String(error.message).slice(0, 100));
        }
      }
    }

    // --- браузер ---
    try {
      var canvas = document.createElement('canvas');
      var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
      add('env', gl ? 'ok' : 'bad', 'WebGL', gl ? 'доступний' : 'недоступний — 3D не працюватиме');
    } catch (error) {
      add('env', 'bad', 'WebGL', 'помилка ініціалізації');
    }
    add('env', 'ok', 'адреса', location.origin + location.pathname);

    if ('serviceWorker' in navigator) {
      var registrations = await navigator.serviceWorker.getRegistrations();
      add('env', 'ok', 'Service Worker: зареєстровано ' + registrations.length);
    } else {
      add('env', 'warn', 'Service Worker не підтримується');
    }
    if ('caches' in window) {
      var keys = await caches.keys();
      add('env', 'ok', 'кеші: ' + (keys.join(', ') || 'порожньо'));
    }

    verdict();
    document.getElementById('report').textContent = lines.join('\n');
  }

  function verdict() {
    var box = document.getElementById('verdict');
    var title, text, css;

    if (failures.server) {
      css = 'bad';
      title = 'Сервер не відповідає';
      text = 'Запустіть його у SketchUp: Extensions ▸ Sketch ▸ Локальний сервер: старт/стоп. ' +
             'Перевірте також, що адреса в браузері — та сама, яку показав плагін.';
    } else if (failures.vendor) {
      css = 'bad';
      title = 'Немає бібліотек three.js';
      text = 'Саме через це екран порожній: застосунок не може завантажитись. ' +
             'Запустіть viewer/vendor/install_libs.bat і перевірте, ' +
             'що з\'явилися шість рядків [ok].';
    } else if (failures.core) {
      css = 'bad';
      title = 'Бракує файлів застосунку';
      text = 'Схоже, тека viewer скопійована не повністю. Розпакуйте архів заново.';
    } else if (failures.data) {
      css = 'warn';
      title = 'Застосунок цілий, але даних немає';
      text = 'Зробіть експорт зі SketchUp або згенеруйте демо: tools/make_demo.py.';
    } else {
      css = 'ok';
      title = 'Усе на місці';
      text = 'Якщо в\'ювер усе одно порожній — натисніть «Скинути кеш і Service Worker», ' +
             'потім відкрийте його заново.';
    }

    box.className = 'verdict ' + css;
    box.innerHTML = '';
    var b = document.createElement('b');
    b.textContent = title;
    var span = document.createElement('span');
    span.textContent = text;
    box.appendChild(b);
    box.appendChild(span);
  }

  window.resetAll = async function () {
    try {
      if ('serviceWorker' in navigator) {
        var registrations = await navigator.serviceWorker.getRegistrations();
        for (var i = 0; i < registrations.length; i++) await registrations[i].unregister();
      }
      if ('caches' in window) {
        var keys = await caches.keys();
        for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
      }
      alert('Кеш і Service Worker очищено. Зараз сторінка перезавантажиться.');
      location.reload();
    } catch (error) {
      alert('Не вдалося очистити: ' + error.message);
    }
  };

  run();
})();
</script>
</body>
</html>
